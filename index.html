<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Menyesuaikan warna address bar browser agar selaras dengan aplikasi -->
    <meta name="theme-color" content="#163f68"> 
    <title>Aplikasi Saya</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Ubah background dasar menjadi warna biru header */
            background-color: #163f68; 
        }
        /* Memberikan jarak aman di bagian atas agar tidak tertutup status bar HP (jam/baterai) */
        .iframe-container {
            width: 100%;
            height: 100%;
            padding-top: 24px; 
            /* UBAH DARI #ffffff MENJADI BIRU agar menyatu dengan header */
            background-color: #163f68; /* Jika birunya kurang pas, Anda bisa sesuaikan kode hex ini */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <!-- Ganti URL di bawah dengan URL Deployment Google Apps Script Anda -->
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxRuFR-cVhRMPjbyOocCjLgiglWg-sTB9DuiIwjZlw0k57T7MemmUuj1qTgDjx2sm_K/exec" 
            allow="geolocation; microphone; camera">
        </iframe>
    </div>

</body>
</html>
